<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="BM Free Music —— 聚合多平台音源、Google 设计语言、亮暗双主题的网络音乐播放器">
  <meta name="theme-color" content="#f8fafd" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131314" media="(prefers-color-scheme: dark)">
  <title>BM Free Music</title>

  <link rel="icon" href="./assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="./assets/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="./assets/icon-180.png">

  <link rel="preload" href="./assets/icon-192.png" as="image">
  <link rel="stylesheet" href="./src/css/tokens.css">
  <link rel="stylesheet" href="./src/css/base.css">
  <link rel="stylesheet" href="./src/css/layout.css">
  <link rel="stylesheet" href="./src/css/components.css">
  <link rel="stylesheet" href="./src/css/views.css">
</head>

<body>
  <a class="visually-hidden" href="#main">跳到主内容</a>

  <div class="app">
    <!-- ================= 顶栏 ================= -->
    <header class="topbar" id="topbar">
      <a class="brand" href="#/discover" data-link>
        <img class="brand__mark" src="./assets/icon-192.png" alt="" width="30" height="30">
        <span class="brand__text">
          <span class="brand__name">BM Free Music</span>
          <span class="brand__sub">多平台聚合播放器</span>
        </span>
      </a>

      <form class="searchbox" id="globalSearch" role="search" autocomplete="off">
        <span class="icon searchbox__icon" data-icon="search" aria-hidden="true"></span>
        <input id="searchInput" type="search" name="q" placeholder="搜索歌曲、歌手、专辑或歌单"
               aria-label="搜索音乐" spellcheck="false">
        <span class="searchbox__kbd" id="searchKbd">Ctrl K</span>
        <button class="icon-btn icon-btn--sm" type="button" id="searchClear" title="清空" hidden>
          <span class="icon" data-icon="close" aria-hidden="true"></span>
        </button>
      </form>

      <div class="topbar__actions">
        <button class="icon-btn job-btn" id="btnJobs" title="后台任务" aria-label="后台任务" hidden>
          <span class="icon" data-icon="sync" aria-hidden="true"></span>
          <span class="job-dot" aria-hidden="true"></span>
        </button>
        <button class="icon-btn" id="btnTheme" title="切换主题" aria-label="切换主题">
          <span class="icon" data-icon="theme" aria-hidden="true"></span>
        </button>
        <button class="icon-btn" id="btnTransfer" title="歌单迁移" aria-label="歌单迁移">
          <span class="icon" data-icon="transfer" aria-hidden="true"></span>
        </button>
        <button class="icon-btn" id="btnAccounts" title="平台账号" aria-label="平台账号">
          <span class="icon" data-icon="account" aria-hidden="true"></span>
        </button>
        <button class="icon-btn" id="btnSettings" title="设置" aria-label="设置">
          <span class="icon" data-icon="settings" aria-hidden="true"></span>
        </button>
      </div>
    </header>

    <!-- ================= 主体 ================= -->
    <div class="shell">
      <nav class="rail" id="rail" aria-label="主导航"></nav>
      <main class="main" id="main" tabindex="-1">
        <div id="view"></div>
      </main>
    </div>

    <!-- ================= 播放条 ================= -->
    <footer class="playbar" id="playbar">
      <div class="playbar__now">
        <div class="playbar__cover" id="pbCover" title="打开正在播放">
          <img id="pbCoverImg" alt="" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E">
        </div>
        <div class="playbar__meta">
          <div class="playbar__title" id="pbTitle" title="打开正在播放">未在播放</div>
          <div class="playbar__artist" id="pbArtist">选择一首歌开始</div>
        </div>
        <button class="icon-btn icon-btn--sm playbar__like" id="pbLike" title="喜欢" aria-label="喜欢">
          <span class="icon" data-icon="heart" aria-hidden="true"></span>
        </button>
      </div>

      <div class="playbar__center">
        <div class="transport">
          <button class="transport__btn" id="btnShuffle" title="随机播放 (S)" aria-label="随机播放">
            <span class="icon icon-sm" data-icon="shuffle" aria-hidden="true"></span>
          </button>
          <button class="transport__btn" id="btnPrev" title="上一首" aria-label="上一首">
            <span class="icon" data-icon="prev" aria-hidden="true"></span>
          </button>
          <button class="transport__btn transport__play" id="btnPlay" title="播放 / 暂停 (空格)"
                  aria-label="播放或暂停">
            <span class="icon" id="btnPlayIcon" data-icon="play" aria-hidden="true"></span>
          </button>
          <button class="transport__btn" id="btnNext" title="下一首" aria-label="下一首">
            <span class="icon" data-icon="next" aria-hidden="true"></span>
          </button>
          <button class="transport__btn" id="btnRepeat" title="循环模式" aria-label="循环模式">
            <span class="icon icon-sm" data-icon="repeat" aria-hidden="true"></span>
          </button>
        </div>

        <div class="progress">
          <span class="progress__time" id="timeCur">0:00</span>
          <input class="slider" type="range" id="seek" min="0" max="1000" value="0"
                 step="1" aria-label="播放进度">
          <span class="progress__time" id="timeDur">0:00</span>
        </div>
      </div>

      <div class="playbar__tools">
        <div class="volume">
          <button class="icon-btn icon-btn--sm" id="btnMute" title="静音" aria-label="静音">
            <span class="icon icon-sm" data-icon="volume" aria-hidden="true"></span>
          </button>
          <input class="slider" type="range" id="volume" min="0" max="100" value="80"
                 aria-label="音量">
        </div>
        <button class="icon-btn" id="btnQueue" title="播放队列 (Q)" aria-label="播放队列">
          <span class="icon" data-icon="queue" aria-hidden="true"></span>
        </button>
        <button class="icon-btn" id="btnExpand" title="全屏播放" aria-label="全屏播放">
          <span class="icon" data-icon="expand" aria-hidden="true"></span>
        </button>
      </div>
    </footer>
  </div>

  <!-- ================= 播放队列抽屉 ================= -->
  <aside class="queue-drawer" id="queueDrawer" aria-label="播放队列" aria-hidden="true">
    <div class="queue-drawer__head">
      <h3>播放队列</h3>
      <div style="display:flex;gap:4px;align-items:center">
        <span class="section__hint" id="queueCount">0 首</span>
        <button class="icon-btn icon-btn--sm" id="queueClear" title="清空队列">
          <span class="icon icon-sm" data-icon="trash" aria-hidden="true"></span>
        </button>
        <button class="icon-btn icon-btn--sm" id="queueClose" title="收起">
          <span class="icon icon-sm" data-icon="close" aria-hidden="true"></span>
        </button>
      </div>
    </div>
    <div class="queue-drawer__list" id="queueList"></div>
  </aside>

  <!-- ================= 覆盖层容器 ================= -->
  <div id="modalHost"></div>
  <div class="toast-host" id="toastHost" aria-live="polite"></div>

  <!-- 本地文件选择 -->
  <input type="file" id="localFileInput" accept="audio/*,.mp3,.flac,.m4a,.ogg,.wav" multiple hidden>

  <!-- 隐藏的音频元素 -->
  <audio id="audio" preload="metadata" crossorigin="anonymous"></audio>

  <script type="module" src="./src/js/app.js"></script>
</body>

</html>
